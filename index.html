<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Приветствие</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #6a11cb, #2575fc);
    font-family: Arial, sans-serif;
  }
  .card {
    background: #fff;
    padding: 40px 60px;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    text-align: center;
  }
  h1 {
    margin: 0 0 10px;
    color: #333;
  }
  p {
    margin: 0;
    color: #666;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Привет! 👋</h1>
    <p>Добро пожаловать на эту страницу.</p>
  </div>
</body>
</html>
